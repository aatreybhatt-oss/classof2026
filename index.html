<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class of 2026 Showcase</title>
    <style>
        :root {
            --primary-color: rgba(0, 0, 0, 0); 
            --bg-color: #590303;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            margin: 0;
        }

        h1 { color: #f6f9ff; margin-bottom: 10px; }
        p { color: #c3cede; margin-bottom: 40px; }

        /* The Container */
        .photo-container {
            position: relative;
            display: inline-block;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border: 5px solid white;
            cursor: crosshair; /* Gives a hint that it's interactive */
        }

        .group-photo {
            display: block;
            max-width: 900px;
            width: 100%;
            height: auto;
        }

        .hotspot {
            position: absolute;
            width: 2.5%;
            /*height: 30px;*/
            aspect-ratio: 1 / 1; /* Ensures the dot remains circular */
            background-color: var(--primary-color);
            border: 0px solid white;
            border-radius: 50%;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease, background-color 0.2s;
            
            /* This makes them invisible by default */
            opacity: 0;
            animation: pulse 2s infinite;
        }

        /* This makes the dots appear only when you hover over the photo */
        .photo-container:hover .hotspot {
            opacity: 1;
        }

        .hotspot:hover {
            transform: scale(1.3);
            background-color: rgba(150, 0, 0, 0.5); /* Turns red on click/hover */
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        /* The Modal (Pop-up) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 100;

            backdrop-filter: blur(2px); /* This blurs the photo behind the modal */
            -webkit-backdrop-filter: blur(2px); /* Support for Safari */

            animation: modalAppear 0.3s ease-out;
        }

        @keyframes modalAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: rgba(25, 22, 22, 0.183);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            border: none;
            background: none;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            margin-top: 20px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
        .button-group {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-project {
            background-color: var(--bg-color);
            color: white;
        }

        .btn-project:hover {
            background-color: #1d0101;
            transform: translateY(-2px);
        }

        .btn-social {
            background-color: #030959;
            color: white;
        }

        .btn-social:hover {
            background-color: #1d0101;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>MPTI 2026</h1>
    <p>Click on a person to see their journey video</p>

    <div class="photo-container" id="photoContainer">
        <!-- Your local image -->
        <img src="CLASS.jpeg" alt="Class Group" class="group-photo">
        
        <!-- Hotspots will be generated here by JavaScript -->
    </div>

    <!-- The Modal Structure -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalName" style="color: #f6f9ff;">Student Name</h2>
            <p id="modalBio" style="color: #c3cede;">Student Bio goes here...</p>
            <div class="video-container">
                <iframe id="modalVideo" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin""></iframe>
            </div>
             <!-- Container for the new links -->
            <div class="button-group" id="buttonGroup">
                <!-- Buttons will be injected here by JS -->
            </div>
        </div>
    </div>

    <script>
        // 1. DATA: Update this list with your classmates' info
        const classmates = [
            {
                name: "Nick Marino",
                bio: "Nick is a heavy bass extraordinaire. He has created the most kickass distortion plugin of 2026 (as voted by MPTI class of 2026).",
                youtubeId: "3zZfrbIjKeE",  // Replace with actual YouTube video ID
                top: "32%",   // Adjust these % to match faces in CLASS.jpeg
                left: "25%",   
                projectLink: "https://google.com", // Replace with real link
                socialLink: "https://instagram.com" // Replace with real link
            },
            {
                name: "Alejandro Garcia",
                bio: "Alejandro is a Peruvian singer songwriter and producer",
                youtubeId: "8GAoAffFvYA",
                top: "44.5%",
                left: "55.75%",
                projectLink: "https://google.com",
                socialLink: "https://instagram.com"
            },
            {
                name: "Alessandro Niro",
                bio: "Alessandro is a talented musician and producer from Mexico.",
                youtubeId: "kYQtaWbDazQ",
                top: "50.5%",
                left: "74%",
                projectLink: "https://google.com",
                socialLink: "https://instagram.com"
            }
        ];

        const container = document.getElementById('photoContainer');
        const modal = document.getElementById('infoModal');
        const modalName = document.getElementById('modalName');
        const modalBio = document.getElementById('modalBio');
        const modalVideo = document.getElementById('modalVideo');
        const buttonGroup = document.getElementById('buttonGroup');

        // 2. LOGIC: Create the dots on the screen automatically
        classmates.forEach(person => {
            const dot = document.createElement('div');
            dot.className = 'hotspot';
            dot.style.top = person.top;
            dot.style.left = person.left;
            
            dot.onclick = () => {
                showDetails(person);
            };

            container.appendChild(dot);
        });

        // 3. LOGIC: Show the modal content
        function showDetails(person) {
            modalName.innerText = person.name;
            modalBio.innerText = person.bio;
            // YouTube Embed URL
            modalVideo.src = `https://www.youtube-nocookie.com/embed/${person.youtubeId}?autoplay=1`;
             // Clear old buttons and add new ones
            buttonGroup.innerHTML = `
                <a href="${person.projectLink}" target="_blank" class="btn btn-project">View Project Materials</a>
                <a href="${person.socialLink}" target="_blank" class="btn btn-social">Follow on Socials</a>
            `;
            modal.style.display = 'flex';
        }

        // 4. LOGIC: Hide the modal
        function closeModal() {
            modal.style.display = 'none';
            modalVideo.src = ""; // Stop the video from playing
            buttonGroup.innerHTML = ""; // Clear buttons when closed
        }

        // Close modal if clicking outside the white box
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
