<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class of 2026 Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page">

    <h1 style="text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">Class of 2026</h1>
    <p style="text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">Click a Polaroid to see their journey</p>

    <!-- The container where all Polaroids will "land" -->
    <div class="gallery-container" id="galleryContainer">
        <!-- JavaScript will inject polaroids here -->
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <p><i>"Real Engineers don't use crossfades" - Pablo Mungia</i></p>
            <p style="font-size: 0.6rem;">Webpage created by Pipo Fernandez & Aatrey Bhatt</p>
            <div class="footer-links">
                <a href="https://www.instagram.com/pipopottamus_/">@pipopottamus_</a> • <a href="https://www.instagram.com/jacktheriffer/">@jacktheriffer</a>
            </div>
        </div>
    </footer>

    <script>
    // 1. THE DATA
    const classmates = [
        { name: "Nick Marino", portraitUrl: "nick.png", profilePage: "profile.html" },
        { name: "Alejandro Garcia", portraitUrl: "alejandro.png", profilePage: "profile.html" },
        { name: "Pipo Fernandez", portraitUrl: "pipo.png", profilePage: "profile.html" },
        { name: "Student 4", portraitUrl: "student4.png", profilePage: "profile.html" },
        { name: "Student 5", portraitUrl: "student5.png", profilePage: "profile.html" }
        // Add the rest of your students here...
    ];

    const container = document.getElementById('galleryContainer');

    // 2. THE SHUFFLE FUNCTION
    // This takes any array and mixes it up randomly
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            // Swap elements
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // 3. THE SCATTER LOGIC
    // First, we shuffle the list
    const shuffledClassmates = shuffleArray([...classmates]);

    // Then, we create the polaroids from the shuffled list
    shuffledClassmates.forEach((person) => {
        const polaroid = document.createElement('a');
        polaroid.href = person.profilePage;
        polaroid.className = 'gallery-polaroid';
        
        // Random rotation between -10 and 10 degrees
        const randomRotation = (Math.random() * 20 - 10); 
        polaroid.style.transform = `rotate(${randomRotation}deg)`;
        
        // Random horizontal offset so they don't line up perfectly
        const randomX = (Math.random() * 40 - 20);
        polaroid.style.marginLeft = `${randomX}px`;

        polaroid.innerHTML = `
            <div class="polaroid-container">
                <img src="${person.portraitUrl}" alt="${person.name}" class="person-portrait">
                <div class="polaroid-footer">
                    <h3 style="margin:0;">${person.name}</h3>
                </div>
            </div>
        `;

        container.appendChild(polaroid);
    });
</script>
</body>
</html>
