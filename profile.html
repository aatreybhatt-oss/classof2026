<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="profile-page">

    <a href="index.html" class="btn-back">← Back to Gallery</a>

    <main class="profile-container">
        <!-- Left Column: Portrait & Bio -->
        <div class="left-column">
            <div class="polaroid-container">
                <img id="personImg" src="" alt="Portrait" class="person-portrait">
                <div class="polaroid-footer">
                    <h3 id="personName">Student Name</h3>
                </div>
            </div>
            <p id="personBio">Student bio goes here...</p>
        </div>


        <!-- Right Column: Project Info & Video -->
        <div class="right-column">
            <div class="project-header">
                <h2 id="projTitle">Project Title</h2>
                <p id="projDesc">Project description goes here...</p>
            </div>

            <div class="video-container">
                <iframe id="mainVideo" src="" allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <div class="button-group" id="btnGroup">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p><i>"Real Engineers don't use crossfades" - Pablo Mungia</i></p>
            <p style="font-size: 0.6rem;">Webpage created by Pipo Fernandez & Aatrey Bhatt</p>
            <div class="footer-links">
                <a href="https://www.instagram.com/pipopottamus_/">@pipopottamus_</a> • <a href="https://www.instagram.com/jacktheriffer/">@jacktheriffer</a>
            </div>
        </div>
    </footer>

    <script>
        // Dummy data for testing - this will eventually come from your Google Sheet/API
        const personData = {
            name: "Nick Marino",
            bio: "Nick is a heavy bass extraordinaire, known for his innovative sound design. An accomplished producer and DJ, he has a knack for creating unique audio experiences.",
            projectTitle: "Redline2Headline",
            projectDescription: "The most-voted distortion plugin of 2026, designed for extreme bass textures. Multiple distortion algorithms and a skin in collaboration with box of frogs.",
            youtubeId: "1sRkASGlOqc",
            portraitUrl: "nick.png", 
            projectLink: "https://google.com",
            socialLink: "https://www.instagram.com/nick.marino13/"
        };

        document.getElementById('projTitle').innerText = personData.projectTitle;
        document.getElementById('projDesc').innerText = personData.projectDescription;
        document.getElementById('personImg').src = personData.portraitUrl;
        document.getElementById('personName').innerText = personData.name;
        document.getElementById('personBio').innerText = personData.bio;
        document.getElementById('mainVideo').src = `https://www.youtube-nocookie.com/embed/${personData.youtubeId}?autoplay=1`;
        
        document.getElementById('btnGroup').innerHTML = `
            <a href="${personData.projectLink}" target="_blank" class="btn btn-project">View Project Materials</a>
            <a href="${personData.socialLink}" target="_blank" class="btn btn-social">Follow on Socials</a>
        `;
    </script>
</body>
</html>
