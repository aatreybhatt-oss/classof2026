name: Deploy to Neocities

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is named master

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: false # Set to true to delete files on Neocities not in dist_dir
          dist_dir: public # Change this if your site files are in a different folder